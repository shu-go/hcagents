# hcagents settings.
# Put this file as hcagents.yaml next to the executable, or in
#   Windows: %AppData%\hcagents\hcagents.yaml
#   macOS:   ~/Library/Application Support/hcagents/hcagents.yaml
#   Linux:   ~/.config/hcagents/hcagents.yaml
# The first one found is used. Changes apply on restart (css: live).

# herdr-app and hc executables. Empty: looked up in PATH.
# GUI apps on macOS don't get your shell's PATH, so set these there.
herdr_app: ""
hc: ""

# Herdr's app folder: the agent icons come from its icons/ (and programs.json).
# Empty: $HERDR_APP_HOME, else $XDG_CONFIG_HOME/herdr-app, else ~/.config/herdr-app.
# GUI apps on macOS may not get HERDR_APP_HOME from your shell either.
herdr_home: ""

# Start Herdr (herdr-app) on startup when it isn't running.
start_herdr: true

# How often to refresh.
interval: 3s

# Your stylesheet, loaded after the built-in one (assets/style.css).
# Relative to this file's folder. Reloaded when it changes.
css: ""

# Size on first start. After that the window opens where you left it
# (saved in state.yaml next to this file; delete it to reset).
window:
  width: 280
  height: 360
  always_on_top: true
