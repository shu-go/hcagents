# hcagents settings.
# Put this file as hcagents.yaml next to the executable, or in
#   Windows: %AppData%\hcagents\hcagents.yaml
#   macOS:   ~/Library/Application Support/hcagents/hcagents.yaml
#   Linux:   ~/.config/hcagents/hcagents.yaml
# The first one found is used. Changes apply on restart (css: live).
# hcagents writes to this file itself only for theme:, grow:, auto_hide:, show:, opacity:, opacity_scope: and status_msg: (the tray menu).
# With no file, it creates one next to the executable.

# herdr-app and hc executables. Empty: looked up in PATH.
# GUI apps on macOS don't get your shell's PATH, so set these there.
herdr_app: ""
hc: ""

# Herdr's app folder: the agent icons come from its icons/ (and programs.json).
# Empty: $HERDR_APP_HOME, else $XDG_CONFIG_HOME/herdr-app, else ~/.config/herdr-app.
# GUI apps on macOS may not get HERDR_APP_HOME from your shell either.
herdr_home: ""

# Start Herdr (herdr-app) on startup when it isn't running.
start_herdr: true

# Agents' statuses and titles come from herdr-core as they change. These are how
# often Herdr's own list (spaces, tabs, whether its window runs) is read again,
# while the window is shown and while it is hidden. Showing the window reads it at once.
interval: 10s
hidden_interval: 30s

# Your stylesheet, loaded after the built-in one (assets/style.css).
# Relative to this file's folder. Reloaded when it changes.
css: ""

# Colors: system (follow the OS), light or dark. Also set from the tray menu
# (Theme), which saves the choice here.
theme: system

# The window's height follows the list. grow is the way it grows and shrinks:
# up (the bottom edge stays) or down (the top edge stays). Also set from the
# tray menu (Grow), which saves the choice here.
grow: up

# The window hides itself when its list (as show: below picks it) runs empty,
# and shows itself, without taking the focus, when agents appear in it again.
# With show: active it hides when all agents are idle; with show: attention,
# when nothing needs you or is done. A pinned agent is listed, so it keeps the
# window up. A window shown or hidden by hand stays so until the next such change.
# true or false (the older empty and idle read as true, off as false).
# Also set from the tray menu (Auto hide), which saves the choice here.
auto_hide: true

# Which agents the window lists, by section (an agent with a working sub-agent
# counts as working):
#   all:       every agent
#   active:    all but idle
#   attention: all but idle and working (Needs you, Done)
# Pinned agents are always listed. The tray badge and tooltip still count every
# agent; auto_hide goes by the listed ones.
# Also set from the tray menu (Show), which saves the choice here.
show: all

# Opacity in percent: 0 to 100, in steps of 10. While the pointer is over the
# window it is fully opaque. At 0, only the agents show (opacity_scope:
# background), or nothing until the pointer is over the window (window).
# Also set from the tray menu (Opacity).
opacity: 100

# What opacity: applies to:
#   background: only the background (title bar, section titles, the gaps); the
#               agents stay opaque
#   window:     the whole window, the agents too
# Also set from the tray menu (Opacity), which saves the choice here.
opacity_scope: background

# Show what each agent says it is doing now, as a small line under
# its row (live, from herdr-core). What it says depends on the agent: Claude Code
# gives the running tool's description while it works; some agents say nothing.
# Also set from the tray menu (Status messages), which saves the choice here.
status_msg: true

# Size on first start (the height then follows the list). After that the window
# opens where you left it (saved in state.yaml next to this file; delete it to reset).
window:
  width: 280
  height: 360
  always_on_top: true
