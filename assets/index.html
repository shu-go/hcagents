<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>hcagents</title>
  <script>
    // Start in the last theme before the first paint (app.js keeps it up to date).
    try {
      const t = localStorage.getItem("hcagents.theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      // And the last opacity (app.js setOpacity), else the window flashes opaque.
      const o = JSON.parse(localStorage.getItem("hcagents.opacity") || "null");
      if (o && o.level < 100) {
        document.documentElement.dataset.opacity = o.scope === "window" ? "window" : "background";
        document.documentElement.style.setProperty("--opacity", String(o.level / 100));
      }
    } catch {}
  </script>
  <link rel="stylesheet" href="/style.css">
  <style id="user-css"></style>
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <span class="titlebar-title">Agents</span>
      <span class="titlebar-source"></span>
      <button class="titlebar-button refresh-button" title="Refresh">⟳</button>
      <button class="titlebar-button hide-button" title="Hide">×</button>
    </header>
    <div class="message"></div>
    <main class="agents"></main>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
